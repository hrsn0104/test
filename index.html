<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기본 계산기</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }
    .calculator {
      width: 320px;
      padding: 16px;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
    }
    .display {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid #d9dce3;
      border-radius: 10px;
      background: #f8fafc;
      text-align: right;
      font-size: 1.8rem;
      font-weight: bold;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 10px;
      font-size: 1rem;
      cursor: pointer;
      background: #e9edf5;
    }
    button:hover {
      filter: brightness(0.96);
    }
    .op {
      background: #dbeafe;
    }
    .equal {
      background: #2563eb;
      color: #fff;
    }
    .clear {
      background: #fecaca;
    }
    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <input id="display" class="display" type="text" value="0" readonly />
    <section class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button data-action="sign">±</button>
      <button data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-action="dot">.</button>
      <button class="equal" data-action="equals">=</button>
    </section>
  </main>

  <script>
    const display = document.getElementById("display");
    let current = "0";
    let previous = null;
    let operator = null;
    let resetOnNextNum = false;

    function updateDisplay() {
      display.value = current;
    }

    function inputNumber(num) {
      if (resetOnNextNum) {
        current = num;
        resetOnNextNum = false;
      } else {
        current = current === "0" ? num : current + num;
      }
      updateDisplay();
    }

    function inputDot() {
      if (resetOnNextNum) {
        current = "0.";
        resetOnNextNum = false;
      } else if (!current.includes(".")) {
        current += ".";
      }
      updateDisplay();
    }

    function clearAll() {
      current = "0";
      previous = null;
      operator = null;
      resetOnNextNum = false;
      updateDisplay();
    }

    function toggleSign() {
      if (current !== "0") {
        current = String(parseFloat(current) * -1);
        updateDisplay();
      }
    }

    function percent() {
      current = String(parseFloat(current) / 100);
      updateDisplay();
    }

    function calculate() {
      if (previous === null || operator === null) return;
      const a = parseFloat(previous);
      const b = parseFloat(current);
      let result = 0;

      if (operator === "+") result = a + b;
      if (operator === "-") result = a - b;
      if (operator === "*") result = a * b;
      if (operator === "/") result = b === 0 ? "오류" : a / b;

      current = String(result);
      previous = null;
      operator = null;
      resetOnNextNum = true;
      updateDisplay();
    }

    function chooseOperator(nextOp) {
      if (operator && !resetOnNextNum) {
        calculate();
      }
      previous = current;
      operator = nextOp;
      resetOnNextNum = true;
    }

    document.querySelector(".buttons").addEventListener("click", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLButtonElement)) return;

      const num = target.dataset.num;
      const op = target.dataset.op;
      const action = target.dataset.action;

      if (num) return inputNumber(num);
      if (op) return chooseOperator(op);

      if (action === "dot") return inputDot();
      if (action === "clear") return clearAll();
      if (action === "equals") return calculate();
      if (action === "sign") return toggleSign();
      if (action === "percent") return percent();
    });

    updateDisplay();
  </script>
</body>
</html>
